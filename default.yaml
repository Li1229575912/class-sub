proxy-groups:
  - name: 主代理
    type: select
    proxies:
      - 优选UDP优先代理
      - 香港节点
      - 日本节点
      - 新加坡节点
      - 美国节点
      - 其他备用
      - DIRECT
  - name: 优选UDP优先代理
    type: fallback
    proxies:
      - HK-UDP4-UQIDC
      - SG-UDP6-AWS
      - JP-UDP4-KHANWEB
      - JP-UDP4-O2
      - JP-UDP4-O1
      - 日本节点
      - 美国节点
      - 新加坡节点
      - 香港节点
      - 其他备用
    url: "http://latency-test.skk.moe/endpoint"
    interval: 180
    timeout: 300
    lazy: true
